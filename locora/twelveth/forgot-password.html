<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Plate.io</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f5f7ff',
                            100: '#ebf0ff',
                            200: '#dde5ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        },
                        neon: {
                            500: '#22d3ee',
                            600: '#06b6d4',
                            700: '#0891b2',
                        }
                    },
                },
            },
        }
    </script>
    <style>
        body {
            background: radial-gradient(ellipse at top, #1d2333 0%, #0f172a 40%, #050815 100%);
            background-attachment: fixed;
        }

        .grid-background {
            background-image:
                linear-gradient(to right, rgba(148, 163, 184, 0.06) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.95), rgba(15, 23, 42, 0.75));
            border: 1px solid rgba(148, 163, 184, 0.2);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.5),
                0 0 0 1px rgba(148, 163, 184, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(24px) saturate(180%);
        }

        .input-futuristic {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #e2e8f0;
            transition: all 0.3s ease;
        }

        .input-futuristic:focus {
            border-color: rgba(34, 211, 238, 0.6);
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.2), inset 0 0 0 1px rgba(34, 211, 238, 0.1);
            outline: none;
            background: rgba(15, 23, 42, 0.8);
        }

        .input-futuristic::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .orb {
            filter: blur(60px);
            opacity: 0.4;
            animation: float 25s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            33% { transform: translate(30px, -30px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #22d3ee 50%, #8b5cf6 100%);
            background-size: 200% 200%;
            animation: gradient-shift 3s ease infinite;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4), 0 0 0 1px rgba(255, 255, 255, 0.1) inset;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            box-shadow: 0 6px 30px rgba(99, 102, 241, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.2) inset;
            transform: translateY(-2px);
        }

        @keyframes gradient-shift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .gradient-text {
            background: linear-gradient(135deg, #818cf8 0%, #22d3ee 50%, #a78bfa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
    </style>
</head>
<body class="min-h-screen grid-background text-slate-100 antialiased">
    <!-- Animated Background Orbs -->
    <div class="pointer-events-none fixed inset-0 overflow-hidden -z-10">
        <div class="orb absolute -top-32 -left-32 h-96 w-96 bg-primary-500/50 rounded-full"></div>
        <div class="orb absolute top-1/4 -right-24 h-[28rem] w-[28rem] bg-neon-500/40 rounded-full" style="animation-delay: -8s;"></div>
        <div class="orb absolute bottom-0 left-1/3 h-[32rem] w-[32rem] bg-violet-500/30 rounded-full" style="animation-delay: -15s;"></div>
    </div>

    <div class="min-h-screen flex items-center justify-center px-4 py-12 relative z-10">
        <div class="w-full max-w-md">
            <!-- Back to Login -->
            <a href="login.html" class="inline-flex items-center text-sm font-medium text-slate-400 hover:text-cyan-400 mb-8 transition-colors group">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2 group-hover:translate-x-[-4px] transition-transform"></i>
                Back to login
            </a>

            <!-- Logo -->
            <div class="flex items-center space-x-3 mb-8">
                <div class="relative flex h-10 w-10 items-center justify-center rounded-2xl bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 ring-1 ring-slate-700/50 shadow-lg shadow-primary-500/20">
                    <span class="absolute inset-0 rounded-2xl bg-gradient-to-br from-primary-500/30 via-neon-500/20 to-violet-500/30 blur-md"></span>
                    <i data-lucide="sparkles" class="relative h-5 w-5 text-neon-400"></i>
                </div>
                <div class="flex flex-col leading-tight">
                    <span class="text-xl font-bold tracking-tight gradient-text">Plate.io</span>
                    <span class="text-[10px] uppercase tracking-[0.2em] text-slate-400 font-medium">Restaurant Menu OS</span>
                </div>
            </div>

            <!-- Forgot Password Card -->
            <div class="glass-panel rounded-2xl p-8">
                <div class="text-center mb-6">
                    <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-gradient-to-br from-cyan-500/20 to-violet-500/20 mb-4 border border-cyan-500/30">
                        <i data-lucide="key" class="w-8 h-8 text-cyan-400"></i>
                    </div>
                    <h2 class="text-3xl font-bold text-white mb-2">Reset Password</h2>
                    <p class="text-slate-400">Enter your email and we'll send you a reset link</p>
                </div>

                <!-- Forgot Password Form -->
                <form action="reset-password.html" method="POST" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-semibold text-slate-300 mb-2">Email</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="mail" class="w-5 h-5 text-slate-500"></i>
                            </div>
                            <input id="email" name="email" type="email" required class="input-futuristic block w-full pl-12 pr-4 py-3 rounded-lg text-sm placeholder-slate-500" placeholder="you@example.com">
                        </div>
                    </div>

                    <button type="submit" class="btn-primary w-full flex justify-center items-center py-3 px-4 rounded-lg text-sm font-semibold text-white">
                        <i data-lucide="send" class="w-5 h-5 mr-2"></i>
                        Send Reset Link
                    </button>
                </form>

                <!-- Back to Login -->
                <p class="mt-8 text-center text-sm text-slate-400">
                    Remember your password?
                    <a href="login.html" class="font-semibold text-cyan-400 hover:text-cyan-300 transition-colors">Sign in</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
