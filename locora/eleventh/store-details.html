<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Store Details - Plate.io</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f5f7ff',
                            100: '#ebf0ff',
                            200: '#dde5ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        },
                        neon: {
                            500: '#22d3ee',
                            600: '#06b6d4',
                            700: '#0891b2',
                        }
                    },
                },
            },
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at top, #1d2333 0, #050815 45%, #020617 100%);
        }

        .grid-background {
            background-image:
                linear-gradient(to right, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.7));
            border: 1px solid rgba(148, 163, 184, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .neon-border {
            border: 1px solid rgba(34, 211, 238, 0.5);
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
        }

        .input-futuristic {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #e2e8f0;
        }

        .input-futuristic:focus {
            border-color: rgba(34, 211, 238, 0.6);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
            outline: none;
        }

        .input-futuristic::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: 1px solid rgba(139, 92, 246, 0.5);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.6);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.3);
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            border-color: rgba(34, 211, 238, 0.5);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
        }

        /* Mobile-first responsive */
        @media (min-width: 640px) {
            .form-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body class="min-h-screen grid-background">
    <!-- Animated Orbs -->
    <div class="orb w-96 h-96 bg-cyan-500 top-20 left-10"></div>
    <div class="orb w-80 h-80 bg-purple-500 top-40 right-20" style="animation-delay: -5s;"></div>
    <div class="orb w-72 h-72 bg-indigo-500 bottom-20 left-1/3" style="animation-delay: -10s;"></div>

    <div class="min-h-screen flex items-center justify-center px-4 py-8 sm:py-12 relative z-10">
        <div class="w-full max-w-2xl">
            <!-- Header -->
            <div class="mb-6 sm:mb-8">
                <div class="flex items-center space-x-2 mb-4">
                    <i data-lucide="sparkles" class="w-6 h-6 sm:w-8 sm:h-8 text-cyan-400"></i>
                    <span class="text-lg sm:text-xl font-bold bg-gradient-to-r from-cyan-400 via-purple-400 to-indigo-400 text-transparent bg-clip-text">Plate.io</span>
                </div>
                <h1 class="text-2xl sm:text-3xl font-bold text-white mb-2">Store Details</h1>
                <p class="text-sm sm:text-base text-slate-400">Complete your restaurant profile to get started</p>
            </div>

            <!-- Store Details Form -->
            <div class="glass-panel rounded-2xl p-4 sm:p-8 neon-border">
                <form action="dashboard.html" method="POST" class="space-y-6">
                    <!-- Basic Information -->
                    <div>
                        <h2 class="text-lg sm:text-xl font-semibold text-white mb-4 flex items-center">
                            <i data-lucide="store" class="w-5 h-5 mr-2 text-cyan-400"></i>
                            Basic Information
                        </h2>
                        <div class="space-y-4">
                            <div>
                                <label for="store-name" class="block text-sm font-medium text-slate-300 mb-2">Store Name</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 sm:pl-4 flex items-center pointer-events-none">
                                        <i data-lucide="store" class="w-4 h-4 sm:w-5 sm:h-5 text-slate-500"></i>
                                    </div>
                                    <input type="text" id="store-name" name="store-name" required class="input-futuristic block w-full pl-10 sm:pl-12 pr-3 sm:pr-4 py-2.5 sm:py-3 rounded-lg text-sm placeholder-slate-500" placeholder="Your Restaurant Name">
                                </div>
                            </div>

                            <div class="form-grid grid grid-cols-1 gap-4">
                                <div>
                                    <label for="phone" class="block text-sm font-medium text-slate-300 mb-2">Phone Number</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-3 sm:pl-4 flex items-center pointer-events-none">
                                            <i data-lucide="phone" class="w-4 h-4 sm:w-5 sm:h-5 text-slate-500"></i>
                                        </div>
                                        <input type="tel" id="phone" name="phone" required class="input-futuristic block w-full pl-10 sm:pl-12 pr-3 sm:pr-4 py-2.5 sm:py-3 rounded-lg text-sm placeholder-slate-500" placeholder="+1 (555) 123-4567">
                                    </div>
                                </div>

                                <div>
                                    <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Email</label>
                                    <div class="relative">
                                        <div class="absolute inset-y-0 left-0 pl-3 sm:pl-4 flex items-center pointer-events-none">
                                            <i data-lucide="mail" class="w-4 h-4 sm:w-5 sm:h-5 text-slate-500"></i>
                                        </div>
                                        <input type="email" id="email" name="email" required class="input-futuristic block w-full pl-10 sm:pl-12 pr-3 sm:pr-4 py-2.5 sm:py-3 rounded-lg text-sm placeholder-slate-500" placeholder="contact@restaurant.com">
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Location -->
                    <div>
                        <h2 class="text-lg sm:text-xl font-semibold text-white mb-4 flex items-center">
                            <i data-lucide="map-pin" class="w-5 h-5 mr-2 text-cyan-400"></i>
                            Location
                        </h2>
                        <div class="space-y-4">
                            <div>
                                <label for="address" class="block text-sm font-medium text-slate-300 mb-2">Street Address</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 sm:pl-4 flex items-center pointer-events-none">
                                        <i data-lucide="map-pin" class="w-4 h-4 sm:w-5 sm:h-5 text-slate-500"></i>
                                    </div>
                                    <input type="text" id="address" name="address" required class="input-futuristic block w-full pl-10 sm:pl-12 pr-3 sm:pr-4 py-2.5 sm:py-3 rounded-lg text-sm placeholder-slate-500" placeholder="123 Main Street">
                                </div>
                            </div>

                            <div class="form-grid grid grid-cols-1 sm:grid-cols-3 gap-4">
                                <div>
                                    <label for="city" class="block text-sm font-medium text-slate-300 mb-2">City</label>
                                    <input type="text" id="city" name="city" required class="input-futuristic block w-full px-3 sm:px-4 py-2.5 sm:py-3 rounded-lg text-sm placeholder-slate-500" placeholder="New York">
                                </div>
                                <div>
                                    <label for="state" class="block text-sm font-medium text-slate-300 mb-2">State</label>
                                    <input type="text" id="state" name="state" required class="input-futuristic block w-full px-3 sm:px-4 py-2.5 sm:py-3 rounded-lg text-sm placeholder-slate-500" placeholder="NY">
                                </div>
                                <div>
                                    <label for="zip" class="block text-sm font-medium text-slate-300 mb-2">ZIP Code</label>
                                    <input type="text" id="zip" name="zip" required class="input-futuristic block w-full px-3 sm:px-4 py-2.5 sm:py-3 rounded-lg text-sm placeholder-slate-500" placeholder="10001">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Business Details -->
                    <div>
                        <h2 class="text-lg sm:text-xl font-semibold text-white mb-4 flex items-center">
                            <i data-lucide="briefcase" class="w-5 h-5 mr-2 text-cyan-400"></i>
                            Business Details
                        </h2>
                        <div class="space-y-4">
                            <div>
                                <label for="cuisine" class="block text-sm font-medium text-slate-300 mb-2">Cuisine Type</label>
                                <div class="relative">
                                    <div class="absolute inset-y-0 left-0 pl-3 sm:pl-4 flex items-center pointer-events-none">
                                        <i data-lucide="utensils-crossed" class="w-4 h-4 sm:w-5 sm:h-5 text-slate-500"></i>
                                    </div>
                                    <select id="cuisine" name="cuisine" required class="input-futuristic block w-full pl-10 sm:pl-12 pr-3 sm:pr-4 py-2.5 sm:py-3 rounded-lg text-sm">
                                        <option value="">Select cuisine type</option>
                                        <option value="italian">Italian</option>
                                        <option value="american">American</option>
                                        <option value="mexican">Mexican</option>
                                        <option value="asian">Asian</option>
                                        <option value="mediterranean">Mediterranean</option>
                                        <option value="indian">Indian</option>
                                        <option value="other">Other</option>
                                    </select>
                                </div>
                            </div>

                            <div>
                                <label for="description" class="block text-sm font-medium text-slate-300 mb-2">Description</label>
                                <textarea id="description" name="description" rows="3" class="input-futuristic block w-full px-3 sm:px-4 py-2.5 sm:py-3 rounded-lg text-sm placeholder-slate-500 resize-none" placeholder="Tell us about your restaurant..."></textarea>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="flex flex-col sm:flex-row gap-3 sm:gap-4 pt-4">
                        <button type="button" class="btn-secondary flex-1 sm:flex-none px-6 py-3 rounded-lg text-sm font-medium text-slate-300">
                            <i data-lucide="x" class="w-4 h-4 mr-2 inline"></i>
                            Skip for now
                        </button>
                        <button type="submit" class="btn-primary flex-1 sm:flex-none px-6 py-3 rounded-lg text-sm font-medium text-white flex items-center justify-center">
                            <i data-lucide="arrow-right" class="w-4 h-4 mr-2"></i>
                            Continue
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
