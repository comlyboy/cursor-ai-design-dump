<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Plate.io</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        primary: {
                            50: '#f5f7ff',
                            100: '#ebf0ff',
                            200: '#dde5ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        },
                        neon: {
                            500: '#22d3ee',
                            600: '#06b6d4',
                            700: '#0891b2',
                        }
                    },
                },
            },
        }
    </script>
    <style>
        body {
            background: radial-gradient(circle at top, #1d2333 0, #050815 45%, #020617 100%);
        }

        .grid-background {
            background-image:
                linear-gradient(to right, rgba(148, 163, 184, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
            background-size: 32px 32px;
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(15, 23, 42, 0.9), rgba(15, 23, 42, 0.7));
            border: 1px solid rgba(148, 163, 184, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
        }

        .neon-glow {
            box-shadow: 0 0 20px rgba(34, 211, 238, 0.3), 0 0 40px rgba(34, 211, 238, 0.2);
        }

        .neon-border {
            border: 1px solid rgba(34, 211, 238, 0.5);
            box-shadow: 0 0 10px rgba(34, 211, 238, 0.3);
        }

        .input-futuristic {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.2);
            color: #e2e8f0;
        }

        .input-futuristic:focus {
            border-color: rgba(34, 211, 238, 0.6);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
            outline: none;
        }

        .input-futuristic::placeholder {
            color: rgba(148, 163, 184, 0.5);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.3;
            animation: float 20s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(30px, -30px) scale(1.1); }
        }

        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: 1px solid rgba(139, 92, 246, 0.5);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            box-shadow: 0 6px 25px rgba(99, 102, 241, 0.6);
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid rgba(148, 163, 184, 0.3);
            transition: all 0.3s ease;
        }

        .btn-secondary:hover {
            border-color: rgba(34, 211, 238, 0.5);
            box-shadow: 0 0 15px rgba(34, 211, 238, 0.2);
        }
    </style>
</head>
<body class="min-h-screen grid-background">
    <!-- Animated Orbs -->
    <div class="orb w-96 h-96 bg-cyan-500 top-20 left-10"></div>
    <div class="orb w-80 h-80 bg-purple-500 top-40 right-20" style="animation-delay: -5s;"></div>
    <div class="orb w-72 h-72 bg-indigo-500 bottom-20 left-1/3" style="animation-delay: -10s;"></div>

    <div class="min-h-screen flex items-center justify-center px-4 py-12 relative z-10">
        <div class="w-full max-w-md">
            <!-- Back to Home -->
            <a href="index.html" class="inline-flex items-center text-sm font-medium text-slate-400 hover:text-cyan-400 mb-8 transition-colors group">
                <i data-lucide="arrow-left" class="w-4 h-4 mr-2 group-hover:translate-x-[-4px] transition-transform"></i>
                Back to home
            </a>

            <!-- Logo -->
            <div class="flex items-center space-x-2 mb-8">
                <i data-lucide="sparkles" class="w-8 h-8 text-cyan-400"></i>
                <span class="text-xl font-bold bg-gradient-to-r from-cyan-400 via-purple-400 to-indigo-400 text-transparent bg-clip-text">Plate.io</span>
            </div>

            <!-- Login Card -->
            <div class="glass-panel rounded-2xl p-8 neon-border">
                <h2 class="text-3xl font-bold text-white mb-2">Welcome back</h2>
                <p class="text-slate-400 mb-8">Access your control panel</p>

                <!-- Login Form -->
                <form action="dashboard.html" method="POST" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-300 mb-2">Email</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="mail" class="w-5 h-5 text-slate-500"></i>
                            </div>
                            <input id="email" name="email" type="email" required class="input-futuristic block w-full pl-12 pr-4 py-3 rounded-lg text-sm placeholder-slate-500" placeholder="you@example.com">
                        </div>
                    </div>

                    <div>
                        <label for="password" class="block text-sm font-medium text-slate-300 mb-2">Password</label>
                        <div class="relative">
                            <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                <i data-lucide="lock" class="w-5 h-5 text-slate-500"></i>
                            </div>
                            <input id="password" name="password" type="password" required class="input-futuristic block w-full pl-12 pr-4 py-3 rounded-lg text-sm placeholder-slate-500" placeholder="••••••••">
                        </div>
                    </div>

                    <div class="flex items-center justify-between">
                        <div class="flex items-center">
                            <input id="remember-me" name="remember-me" type="checkbox" class="h-4 w-4 text-indigo-500 focus:ring-indigo-500 border-slate-600 rounded bg-slate-800">
                            <label for="remember-me" class="ml-2 block text-sm text-slate-300">Remember me</label>
                        </div>
                        <a href="forgot-password.html" class="text-sm font-medium text-cyan-400 hover:text-cyan-300 transition-colors">Forgot password?</a>
                    </div>

                    <button type="submit" class="btn-primary w-full flex justify-center items-center py-3 px-4 rounded-lg text-sm font-medium text-white">
                        <i data-lucide="log-in" class="w-5 h-5 mr-2"></i>
                        Sign in
                    </button>
                </form>

                <!-- Social Login -->
                <div class="mt-8">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-slate-700"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span class="px-2 bg-slate-900 text-slate-500">Or continue with</span>
                        </div>
                    </div>

                    <div class="mt-6 grid grid-cols-2 gap-3">
                        <button type="button" class="btn-secondary w-full inline-flex justify-center items-center py-3 px-4 rounded-lg text-sm font-medium text-slate-300">
                            <i data-lucide="chrome" class="w-5 h-5 mr-2"></i>
                            Google
                        </button>
                        <button type="button" class="btn-secondary w-full inline-flex justify-center items-center py-3 px-4 rounded-lg text-sm font-medium text-slate-300">
                            <i data-lucide="facebook" class="w-5 h-5 mr-2"></i>
                            Facebook
                        </button>
                    </div>
                </div>

                <!-- Sign Up Link -->
                <p class="mt-8 text-center text-sm text-slate-400">
                    Don't have an account?
                    <a href="signup.html" class="font-medium text-cyan-400 hover:text-cyan-300 transition-colors">Sign up</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
