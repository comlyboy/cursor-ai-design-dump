<!DOCTYPE html>
<html lang="en" class="dark">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Dark Mode Card - Tailwind</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			darkMode: 'class',
			theme: {
				extend: {
					colors: {
						primary: '#f56565',
						'primary-dark': '#fc8181',
					},
				},
			},
		};
	</script>
	<style>
		::selection {
			background-color: #f56565;
			color: white;
		}
	</style>
</head>

<body
	class="bg-gradient-to-br from-gray-100 to-gray-200 dark:from-[#0d1117] dark:to-[#0d1117] text-gray-800 dark:text-gray-100 transition-colors duration-500">
	<div class="min-h-screen flex items-center justify-center px-4">
		<div
			class="relative w-full max-w-md rounded-3xl p-8 shadow-2xl bg-white/70 dark:bg-gray-800/70 backdrop-blur-xl border border-gray-300 dark:border-gray-700 transition-all duration-500">
			<!-- Toggle Button -->
			<button id="toggleDark"
				class="absolute top-4 right-4 px-3 py-1.5 text-sm rounded-lg bg-primary dark:bg-primary-dark text-white shadow hover:opacity-90 transition">
				Toggle
			</button>

			<!-- Card Content -->
			<h1 class="text-3xl font-bold text-primary dark:text-primary-dark mb-2">Tailwind UI</h1>
			<p class="text-base text-gray-700 dark:text-gray-300 mb-6">
				A clean card that adapts beautifully to light and dark mode. Built with Tailwind CSS and just a touch of flair.
			</p>

			<div class="flex space-x-4">
				<button
					class="flex-1 py-2 rounded-xl bg-primary dark:bg-primary-dark text-white font-medium shadow-md hover:brightness-110 transition">
					Confirm
				</button>
				<button
					class="flex-1 py-2 rounded-xl border border-primary dark:border-primary-dark text-primary dark:text-primary-dark hover:bg-primary/10 dark:hover:bg-primary-dark/10 transition">
					Cancel
				</button>
			</div>
		</div>
	</div>

	<script>
		const html = document.documentElement;
		const toggleBtn = document.getElementById('toggleDark');

		toggleBtn.addEventListener('click', () => {
			html.classList.toggle('dark');
		});
	</script>
</body>

</html>
