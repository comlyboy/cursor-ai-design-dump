<!DOCTYPE html>
<html lang="en" class="dark">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Dark Login</title>
	<script src="https://cdn.tailwindcss.com"></script>
	<script>
		tailwind.config = {
			darkMode: 'class',
			theme: {
				extend: {
					colors: {
						primary: '#f56565',
					},
				}
			}
		}
	</script>
	<link href="https://unpkg.com/lucide@latest/dist/umd/lucide.js" rel="stylesheet" />
</head>

<body
	class="min-h-screen bg-gradient-to-br from-[#1a1a1a] via-[#232323] to-[#1a1a1a] flex items-center justify-center text-white">


	<div
		class="backdrop-blur-md bg-white/10 dark:bg-white/10 border border-white/20 rounded-2xl shadow-xl p-8 sm:p-10 w-full max-w-md">
		<div class="flex flex-col items-center mb-6">
			<div class="bg-primary p-3 rounded-full">
				<i data-lucide="lock" class="text-white w-6 h-6"></i>
			</div>
			<h2 class="mt-3 text-2xl font-semibold text-white">Welcome Back</h2>
			<p class="text-sm text-gray-300">Login to continue</p>
		</div>

		<form class="space-y-5">
			<div class="relative">
				<input type="email" required placeholder=" "
					class="peer w-full bg-transparent border border-gray-600 text-white placeholder-transparent px-4 py-3 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" />
				<label
					class="absolute left-4 top-3 text-gray-400 text-sm peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 transition-all">
					Email Address
				</label>
			</div>

			<div class="relative">
				<input id="password" type="password" required placeholder=" "
					class="peer w-full bg-transparent border border-gray-600 text-white placeholder-transparent px-4 py-3 rounded-md focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" />
				<label
					class="absolute left-4 top-3 text-gray-400 text-sm peer-placeholder-shown:top-3.5 peer-placeholder-shown:text-base peer-placeholder-shown:text-gray-500 transition-all">
					Password
				</label>
				<button type="button" onclick="togglePassword()"
					class="absolute right-3 top-3 text-gray-400 hover:text-primary">
					<i data-lucide="eye-off" id="eyeIcon" class="w-5 h-5"></i>
				</button>
			</div>

			<div class="flex justify-between items-center text-sm text-gray-300">
				<label class="flex items-center space-x-2">
					<input type="checkbox" class="accent-primary bg-transparent border-gray-600">
					<span>Remember me</span>
				</label>
				<a href="#" class="text-primary hover:underline">Forgot Password?</a>
			</div>

			<button type="submit"
				class="w-full bg-primary text-white font-semibold py-3 rounded-md hover:bg-red-600 transition">
				Login
			</button>
		</form>

		<p class="text-center text-sm text-gray-400 mt-6">
			Don't have an account?
			<a href="#" class="text-primary hover:underline">Sign up</a>
		</p>
	</div>

	<script>
		lucide.createIcons();

		function togglePassword() {
			const input = document.getElementById('password');
			const icon = document.getElementById('eyeIcon');
			const isPassword = input.type === 'password';

			input.type = isPassword ? 'text' : 'password';
			icon.setAttribute('data-lucide', isPassword ? 'eye' : 'eye-off');
			lucide.createIcons();
		}
	</script>
</body>

</html>
